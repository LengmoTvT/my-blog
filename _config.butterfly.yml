# ===================================
# Butterfly 主题配置 - 冷漠的博客
# 仿照 xiaomenghua.top (Butterfly 默认蓝绿配色)
# 在此文件修改配置，主题升级不会覆盖
# ===================================

# ---------- 导航栏 ----------
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

# 菜单 (导航栏条目，格式: 名称: 路径 || 图标)
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags

# ---------- 社交图标 ----------
social:
  fab fa-github: https://github.com/LengmoTvT || GitHub || '#24292e'

# ---------- 代码块 ----------
code_blocks:
  theme: light
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# ---------- 图片设置 ----------
# 网站图标 (浏览器标签页小图标)
favicon: /img/favicon.png

# 头像 (侧边栏作者卡片头像)
avatar:
  img: /img/avatar.png
  effect: false

disable_top_img: false
index_img:
default_top_img:
archive_img:
tag_img:
tag_per_img:
category_img:
category_per_img:
footer_img: false

background:

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    # - /img/cover1.jpg

error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

error_404:
  enable: true
  subtitle: '页面找不到了'
  background: /img/error-page.png

# ---------- 首页设置 ----------
index_site_info_top:
index_top_img_height:

subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 这是冷漠的博客
    - 记录学习与折腾
    - Stay curious, stay cold.

index_layout: 3

index_post_content:
  method: 3
  length: 500

# ---------- 文章设置 ----------
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: false

post_edit:
  enable: false
  url:

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

noticeOutdate:
  enable: false

# ---------- 页脚 ----------
footer:
  nav:
  owner:
    enable: true
    since: 2025
  copyright:
    enable: true
    version: false
  custom_text: 冷漠的博客 · Powered by Hexo & Butterfly

# ---------- 侧边栏 ----------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 冷漠 · 学习记录与折腾笔记
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/LengmoTvT
  card_announcement:
    enable: true
    content: 欢迎来到冷漠的博客
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: false
    custom_colors:
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    series_title: false
    orderBy: 'date'
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    runtime_date:

rightside_bottom:

translate:
  enable: false

readmode: true

# 深色模式 (浅色/深色切换)
darkmode:
  enable: true
  button: true
  autoChangeMode: false
  start:
  end:

rightside_scroll_percent: false

rightside_item_order:
  enable: false
  hide:
  show:

rightside_config_animation: true

anchor:
  auto_update: false
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

wordcount:
  enable: false

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

math:
  use:
  per_page: true
  hide_scrollbar: false
  mathjax:
    enableMenu: true
    tags: none
  katex:
    copy_tex: false

# ---------- 站内搜索 (本地搜索) ----------
search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
      CDN:

share:
  use: sharejs
  sharejs:
    sites: wechat,weibo,qq
  addtoany:
    item: wechat,sina_weibo,email,copy_link

comments:
  use:

baidu_analytics:
google_analytics:
cloudflare_analytics:
microsoft_clarity:
umami_analytics:
  enable: false
  serverURL:
  script_name: script.js
  website_id:
  option:
  UV_PV:
    site_uv: false
    site_pv: false
    page_pv: false
    token:

google_tag_manager:
  tag_id:
  domain:

google_adsense:
  enable: false

ad:
  index:
  aside:
  post:

site_verification:

# ---------- 主题色 (配色) ----------
theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49b1f5"
  meta_theme_color_light: "#ffffff"
  meta_theme_color_dark: "#0d0d0d"

category_ui:
tag_ui:

rounded_corners_ui: true
text_align_justify: false

mask:
  header: true
  footer: true

preloader:
  enable: true
  source: 1
  pace_css_url:

enter_transitions: true

display_mode: light

beautify:
  enable: false

font:
  global_font_size:
  code_font_size:
  font_family:
  code_font_family:

blog_title_font:
  font_link:
  font_family:

hr_icon:
  enable: true
  icon:
  icon_top:

activate_power_mode:
  enable: false

canvas_ribbon:
  enable: false
canvas_fluttering_ribbon:
  enable: false
canvas_nest:
  enable: false
fireworks:
  enable: false
click_heart:
  enable: false
clickShowText:
  enable: false

# ---------- 图片灯箱 ----------
lightbox: fancybox

series:
  enable: false
abcjs:
  enable: false
mermaid:
  enable: false
chartjs:
  enable: false

note:
  style: flat
  icons: true
  border_radius: 3
  light_bg_offset: 0

pjax:
  enable: false

aplayerInject:
  enable: false

snackbar:
  enable: false

instantpage: false

lazyload:
  enable: false

pwa:
  enable: false

Open_Graph_meta:
  enable: true
  option:

structured_data:
  enable: false

css_prefix: true

inject:
  head:
  bottom:

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
  custom_format:
  option:
